name: Gerar Modelo 3D JARVES V10.6 Remodelado

on:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Criar JARVES remodelado
        run: |
          mkdir -p "$GITHUB_WORKSPACE/modelo3d"
          cat > /tmp/jarves_v10_6.py <<'PY'
          import bpy, math, os
          from mathutils import Vector

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          def mat(name, color, metallic=.35, rough=.24, emission=None):
              m=bpy.data.materials.new(name)
              m.diffuse_color=(*color,1)
              m.use_nodes=True
              bs=m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value=(*color,1)
              bs.inputs["Metallic"].default_value=metallic
              bs.inputs["Roughness"].default_value=rough
              if emission:
                  if "Emission" in bs.inputs:
                      bs.inputs["Emission"].default_value=(*emission,1)
                  if "Emission Strength" in bs.inputs:
                      bs.inputs["Emission Strength"].default_value=4.0
              return m

          WHITE=mat("Armadura branca",(.82,.88,.92),.55,.18)
          BLACK=mat("Preto brilhante",(.008,.015,.022),.72,.12)
          DARK=mat("Juntas",(.025,.04,.055),.70,.20)
          CYAN=mat("Luz cyan",(0,.55,.95),.25,.12,(0,.75,1))

          def cube(name, loc, scale, material, bevel=.08, rot=(0,0,0)):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc, rotation=rot)
              o=bpy.context.object; o.name=name; o.scale=scale
              bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              if bevel:
                  mod=o.modifiers.new("Rounded","BEVEL"); mod.width=bevel; mod.segments=5
                  bpy.context.view_layer.objects.active=o
                  bpy.ops.object.modifier_apply(modifier=mod.name)
              o.data.materials.append(material)
              return o

          def sph(name,loc,scale,material):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=32, ring_count=16, location=loc)
              o=bpy.context.object; o.name=name; o.scale=scale
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              o.data.materials.append(material); return o

          def cyl(name,loc,radius,depth,material,rot=(0,0,0)):
              bpy.ops.mesh.primitive_cylinder_add(vertices=32,radius=radius,depth=depth,location=loc,rotation=rot)
              o=bpy.context.object; o.name=name; o.data.materials.append(material); return o

          # CABEÇA — grande, larga e achatada, não esférica
          cube("Head",(0,0,2.48),(.62,.36,.39),WHITE,.20)
          cube("Visor",(0,-.365,2.48),(.49,.035,.19),BLACK,.10)
          sph("Eye.L",(-.22,-.407,2.50),(.070,.025,.070),CYAN)
          sph("Eye.R",(.22,-.407,2.50),(.070,.025,.070),CYAN)

          # orelhas laterais pequenas
          cyl("Ear.L",(-.655,0,2.48),.095,.075,DARK,rot=(0,math.radians(90),0))
          cyl("Ear.R",(.655,0,2.48),.095,.075,DARK,rot=(0,math.radians(90),0))
          cyl("EarLight.L",(-.700,0,2.48),.065,.025,CYAN,rot=(0,math.radians(90),0))
          cyl("EarLight.R",(.700,0,2.48),.065,.025,CYAN,rot=(0,math.radians(90),0))

          # antenas
          for x in (-.39,.39):
              cyl("Antenna", (x,0,2.98), .032,.27,DARK)
              sph("AntennaLight",(x,0,3.14),(.075,.075,.075),CYAN)

          # pescoço e corpo magro com placas
          cyl("Neck",(0,0,1.98),.14,.18,DARK)
          cyl("NeckLight",(0,0,2.02),.155,.045,CYAN)
          cube("Torso",(0,0,1.55),(.43,.27,.48),WHITE,.17)
          cube("ChestPanel",(0,-.285,1.60),(.30,.028,.30),WHITE,.09)
          sph("ChestCore",(0,-.325,1.62),(.145,.035,.145),DARK)
          sph("ChestGlow",(0,-.365,1.62),(.105,.020,.105),CYAN)
          cube("Waist",(0,0,1.08),(.31,.24,.11),DARK,.055)
          cube("WaistGlow",(0,-.245,1.08),(.16,.025,.035),CYAN,.018)
          cube("Pelvis",(0,0,.88),(.29,.22,.20),WHITE,.10)

          # braços alinhados e segmentados
          for side,x in (("L",-1),("R",1)):
              sx=.57*x
              sph("Shoulder."+side,(sx,0,1.72),(.18,.18,.18),DARK)
              sph("ShoulderArmor."+side,(sx,0,1.72),(.155,.19,.155),WHITE)

              # braço superior e antebraço verticais
              cyl("UpperArm."+side,(.66*x,0,1.39),.115,.43,WHITE)
              cube("UpperArmPanel."+side,(.66*x,-.118,1.39),(.070,.018,.13),BLACK,.025)
              sph("Elbow."+side,(.66*x,0,1.13),(.12,.12,.12),DARK)
              sph("ElbowGlow."+side,(.66*x,-.105,1.13),(.075,.025,.075),CYAN)
              cyl("Forearm."+side,(.66*x,0,.86),.125,.40,WHITE)
              cyl("Wrist."+side,(.66*x,0,.62),.095,.10,DARK)
              cyl("WristGlow."+side,(.66*x,0,.62),.105,.035,CYAN)

              # alicate: palma + duas mandíbulas inclinadas
              cube("Palm."+side,(.66*x,0,.51),(.12,.10,.11),DARK,.045)
              cube("ClawA."+side,(.66*x,-.105,.32),(.075,.055,.22),WHITE,.045,
                   rot=(math.radians(-10),0,math.radians(-10*x)))
              cube("ClawB."+side,(.66*x,.105,.32),(.075,.055,.22),WHITE,.045,
                   rot=(math.radians(10),0,math.radians(10*x)))
              cube("ClawTipA."+side,(.66*x,-.135,.15),(.060,.050,.085),BLACK,.035)
              cube("ClawTipB."+side,(.66*x,.135,.15),(.060,.050,.085),BLACK,.035)

          # pernas estreitas e detalhadas
          for side,x in (("L",-1),("R",1)):
              hx=.22*x
              sph("Hip."+side,(hx,0,.72),(.15,.15,.15),DARK)
              cube("Thigh."+side,(hx,0,.38),(.14,.16,.30),WHITE,.08)
              cube("KneeGlow."+side,(hx,-.165,.08),(.095,.025,.045),CYAN,.02)
              cube("Shin."+side,(hx,0,-.25),(.15,.17,.31),WHITE,.07)
              cube("ShinPanel."+side,(hx,-.175,-.25),(.075,.018,.16),BLACK,.02)
              cube("Foot."+side,(hx,-.055,-.61),(.18,.28,.10),WHITE,.055)
              cube("FootGlow."+side,(hx,-.305,-.61),(.10,.025,.035),CYAN,.018)

          # exportar apenas o robô
          out=os.path.join(os.environ["GITHUB_WORKSPACE"],"modelo3d","jarves_v10_6_remodelado.glb")
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.export_scene.gltf(filepath=out,export_format='GLB',export_animations=False,export_apply=True)
          print("JARVES V10.6 REMODELADO CRIADO:",out)
          PY

      - name: Gerar GLB V10.6
        run: |
          blender -b --python /tmp/jarves_v10_6.py 2>&1 | tee "$GITHUB_WORKSPACE/modelo3d/blender-v10-6.log"

      - name: Verificar GLB V10.6
        run: |
          ls -lh "$GITHUB_WORKSPACE/modelo3d/jarves_v10_6_remodelado.glb"
          test -s "$GITHUB_WORKSPACE/modelo3d/jarves_v10_6_remodelado.glb"

      - name: Publicar JARVES 3D V10.6
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-3D-V10-6-REMODELADO-GLB
          path: modelo3d/jarves_v10_6_remodelado.glb
          retention-days: 30
