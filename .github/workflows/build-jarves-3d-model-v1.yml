name: Gerar Modelo 3D JARVES V1

on:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Criar script 3D do JARVES
        run: |
          cat > /tmp/jarves_model.py <<'PY'
          import bpy, math
          from mathutils import Vector

          # Limpar cena
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          # Materiais
          def mat(name, color, metallic=0.0, rough=0.35, emission=None):
              m=bpy.data.materials.new(name)
              m.diffuse_color=(*color,1)
              m.use_nodes=True
              bs=m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value=(*color,1)
              bs.inputs["Metallic"].default_value=metallic
              bs.inputs["Roughness"].default_value=rough
              if emission:
                  # Blender 3.x
                  if "Emission" in bs.inputs:
                      bs.inputs["Emission"].default_value=(*emission,1)
                  if "Emission Strength" in bs.inputs:
                      bs.inputs["Emission Strength"].default_value=3.5
              return m

          WHITE=mat("Armor_White",(0.82,0.88,0.92),0.55,0.22)
          DARK=mat("Visor_Black",(0.008,0.015,0.025),0.65,0.12)
          JOINT=mat("Joint_Dark",(0.035,0.055,0.075),0.75,0.25)
          BLUE=mat("LED_Cyan",(0.0,0.35,0.85),0.25,0.16,(0.0,0.55,1.0))

          def cube(name, loc, scale, material, bevel=0.12, parent=None):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc)
              o=bpy.context.object; o.name=name
              o.scale=scale
              bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              if bevel:
                  mod=o.modifiers.new("Rounded","BEVEL"); mod.width=bevel; mod.segments=4
                  bpy.context.view_layer.objects.active=o
                  bpy.ops.object.modifier_apply(modifier=mod.name)
              o.data.materials.append(material)
              if parent: o.parent=parent
              return o

          def sphere(name, loc, scale, material, parent=None):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=32, ring_count=16, location=loc)
              o=bpy.context.object; o.name=name; o.scale=scale
              bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              o.data.materials.append(material)
              if parent: o.parent=parent
              return o

          def cyl(name, loc, radius, depth, material, rot=(0,0,0), parent=None):
              bpy.ops.mesh.primitive_cylinder_add(vertices=32, radius=radius, depth=depth, location=loc, rotation=rot)
              o=bpy.context.object; o.name=name; o.data.materials.append(material)
              if parent: o.parent=parent
              return o

          # Armature / esqueleto
          bpy.ops.object.armature_add(enter_editmode=True, location=(0,0,0))
          arm=bpy.context.object; arm.name="JARVES_Rig"
          eb=arm.data.edit_bones
          root=eb[0]; root.name="Root"; root.head=(0,0,0); root.tail=(0,0,0.6)

          def bone(name, head, tail, parent=root):
              b=eb.new(name); b.head=head; b.tail=tail; b.parent=parent
              return b

          spine=bone("Spine",(0,0,0.6),(0,0,2.4))
          headb=bone("Head",(0,0,2.35),(0,0,3.25),spine)
          lua=bone("UpperArm.L",(0,0,2.15),(-0.85,0,1.95),spine)
          lfa=bone("Forearm.L",(-0.85,0,1.95),(-1.35,0,1.45),lua)
          rua=bone("UpperArm.R",(0,0,2.15),(0.85,0,1.95),spine)
          rfa=bone("Forearm.R",(0.85,0,1.95),(1.35,0,1.45),rua)
          lul=bone("Thigh.L",(-0.38,0,0.95),(-0.38,0,0.15),root)
          lll=bone("Shin.L",(-0.38,0,0.15),(-0.38,0,-0.65),lul)
          rul=bone("Thigh.R",(0.38,0,0.95),(0.38,0,0.15),root)
          rll=bone("Shin.R",(0.38,0,0.15),(0.38,0,-0.65),rul)
          bpy.ops.object.mode_set(mode='OBJECT')

          # Corpo — peças independentes para animação
          pelvis=cube("Pelvis",(0,0,0.9),(0.62,0.36,0.30),WHITE,0.18,arm)
          torso=cube("Torso",(0,0,1.65),(0.82,0.42,0.70),WHITE,0.25,arm)
          chest=sphere("ChestCore",(0,-0.43,1.75),(0.22,0.08,0.22),BLUE,arm)

          neck=cyl("Neck",(0,0,2.35),0.18,0.25,JOINT,parent=arm)
          head=cube("HeadShell",(0,0,2.78),(0.78,0.46,0.55),WHITE,0.28,arm)
          visor=cube("Visor",(0,-0.43,2.82),(0.60,0.08,0.31),DARK,0.16,arm)
          eyeL=sphere("Eye.L",(-0.24,-0.525,2.86),(0.10,0.035,0.065),BLUE,arm)
          eyeR=sphere("Eye.R",(0.24,-0.525,2.86),(0.10,0.035,0.065),BLUE,arm)

          # Antenas
          for x in (-0.50,0.50):
              cyl("Antenna", (x,0,3.43),0.055,0.48,JOINT,parent=arm)
              sphere("AntennaLight",(x,0,3.70),(0.11,0.11,0.11),BLUE,arm)

          # Braços
          for side,x in (("L",-1),("R",1)):
              sphere("Shoulder."+side,(0.83*x,0,2.05),(0.28,0.28,0.28),JOINT,arm)
              upper=cyl("UpperArm."+side,(1.04*x,0,1.80),0.20,0.62,WHITE,
                        rot=(0,math.radians(25*x),0),parent=arm)
              elbow=sphere("Elbow."+side,(1.20*x,0,1.52),(0.18,0.18,0.18),BLUE,arm)
              fore=cyl("Forearm."+side,(1.34*x,0,1.25),0.19,0.58,WHITE,
                       rot=(0,math.radians(18*x),0),parent=arm)
              sphere("Hand."+side,(1.46*x,0,0.96),(0.24,0.22,0.24),WHITE,arm)

          # Pernas e pés
          for side,x in (("L",-0.38),("R",0.38)):
              sphere("Hip."+side,(x,0,0.72),(0.24,0.24,0.24),JOINT,arm)
              cyl("Thigh."+side,(x,0,0.30),0.23,0.72,WHITE,parent=arm)
              sphere("Knee."+side,(x,-0.03,-0.10),(0.20,0.20,0.20),BLUE,arm)
              cyl("Shin."+side,(x,0,-0.48),0.22,0.65,WHITE,parent=arm)
              cube("Foot."+side,(x,-0.12,-0.90),(0.34,0.52,0.18),WHITE,0.16,arm)

          # Pequenos LEDs do tronco
          for x in (-0.48,0.48):
              sphere("ChestLED",(x,-0.43,1.45),(0.08,0.04,0.08),BLUE,arm)

          # Parenting rígido por ossos principais (suficiente para protótipo articulado)
          bone_map = {
              "HeadShell":"Head","Visor":"Head","Eye.L":"Head","Eye.R":"Head",
              "UpperArm.L":"UpperArm.L","Forearm.L":"Forearm.L",
              "UpperArm.R":"UpperArm.R","Forearm.R":"Forearm.R",
              "Thigh.L":"Thigh.L","Shin.L":"Shin.L","Foot.L":"Shin.L",
              "Thigh.R":"Thigh.R","Shin.R":"Shin.R","Foot.R":"Shin.R"
          }
          for objname,bn in bone_map.items():
              o=bpy.data.objects.get(objname)
              if o:
                  o.parent=arm
                  o.parent_type='BONE'
                  o.parent_bone=bn
                  o.matrix_parent_inverse=arm.matrix_world.inverted()

          # Animação "Idle"
          bpy.context.view_layer.objects.active=arm
          arm.animation_data_create()
          action=bpy.data.actions.new("Idle")
          arm.animation_data.action=action
          for f,ang in [(1,0),(30,0.08),(60,0),(90,-0.08),(120,0)]:
              arm.pose.bones["Head"].rotation_mode='XYZ'
              arm.pose.bones["Head"].rotation_euler[2]=ang
              arm.pose.bones["Head"].keyframe_insert("rotation_euler",frame=f)

          # Animação "Wave" no braço direito
          wave=bpy.data.actions.new("Wave")
          arm.animation_data.action=wave
          pb=arm.pose.bones["UpperArm.R"]; pb.rotation_mode='XYZ'
          pf=arm.pose.bones["Forearm.R"]; pf.rotation_mode='XYZ'
          for f,a in [(1,0),(10,-1.0),(20,-0.55),(30,-1.0),(40,-0.55),(50,0)]:
              pb.rotation_euler[1]=a
              pf.rotation_euler[2]=a*0.65
              pb.keyframe_insert("rotation_euler",frame=f)
              pf.keyframe_insert("rotation_euler",frame=f)

          # Manter Idle como ação ativa
          arm.animation_data.action=action

          # Chão de referência NÃO exportado
          # Exportar GLB
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.export_scene.gltf(
              filepath="/tmp/jarves_v1.glb",
              export_format='GLB',
              export_animations=True,
              export_apply=True
          )
          print("JARVES GLB criado.")
          PY

      - name: Gerar GLB articulado
        run: blender -b --python /tmp/jarves_model.py

      - name: Verificar modelo
        run: |
          ls -lh /tmp/jarves_v1.glb
          test -s /tmp/jarves_v1.glb

      - name: Publicar modelo 3D
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-3D-V1-GLB
          path: /tmp/jarves_v1.glb
          retention-days: 30
