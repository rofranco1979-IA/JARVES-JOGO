name: Gerar APK JARVES JOGO V4.2 - GLB INTERATIVO

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar GLB V10.9.5 aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/glb app/src/main/assets
          gh api repos/${{ github.repository }}/actions/artifacts/10834341766/zip > /tmp/jarves.zip
          unzip -o /tmp/jarves.zip -d /tmp/glb
          cp /tmp/glb/jarves_v10_9_5.glb app/src/main/assets/jarves.glb
          test -s app/src/main/assets/jarves.glb

      - name: Criar projeto Android V4.2
        run: |
          mkdir -p app/src/main/java/com/jarves/jogo app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="JARVES-JOGO"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
            namespace "com.jarves.jogo"
            compileSdk 35
            defaultConfig {
              applicationId "com.jarves.jogo"
              minSdk 26
              targetSdk 35
              versionCode 42
              versionName "4.2"
            }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <application android:theme="@style/AppTheme" android:label="JARVES JOGO" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/assets/jarves.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
            <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
            <style>
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
              model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
            </style>
          </head>
          <body>
            <model-viewer id="j" src="jarves.glb" camera-controls disable-zoom
              interaction-prompt="none" shadow-intensity="1" exposure="1.05"
              camera-orbit="0deg 82deg 4.6m" autoplay></model-viewer>
            <script>
              const j=document.getElementById('j');
              window.playJarves=function(n){
                if(!j.availableAnimations || !j.availableAnimations.includes(n)) return false;
                j.pause(); j.animationName=n; j.currentTime=0; j.play({repetitions:1}); return true;
              }
              window.jarvesAnimations=function(){ return JSON.stringify(j.availableAnimations||[]); }
            </script>
          </body>
          </html>
          EOF

          cat > app/src/main/java/com/jarves/jogo/MainActivity.java <<'EOF'
          package com.jarves.jogo;

          import android.Manifest;
          import android.app.Activity;
          import android.os.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import android.speech.*;
          import android.content.Intent;
          import java.util.*;

          public class MainActivity extends Activity {
            WebView web;
            TextView status;
            SpeechRecognizer sr;
            Handler h=new Handler(Looper.getMainLooper());
            int taps=0; long tapWindow=0;

            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              FrameLayout root=new FrameLayout(this);
              root.setBackgroundColor(Color.rgb(10,12,16));

              web=new WebView(this);
              web.setBackgroundColor(Color.TRANSPARENT);
              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setAllowFileAccess(true);
              web.getSettings().setDomStorageEnabled(true);
              web.setWebViewClient(new WebViewClient());
              root.addView(web,new FrameLayout.LayoutParams(-1,-1));

              status=new TextView(this);
              status.setText("JARVES V4.2 • GLB V10.9.5");
              status.setTextColor(Color.WHITE);
              status.setTextSize(14);
              status.setPadding(20,20,20,20);
              FrameLayout.LayoutParams sp=new FrameLayout.LayoutParams(-2,-2,Gravity.TOP|Gravity.CENTER_HORIZONTAL);
              root.addView(status,sp);

              Button mic=new Button(this); mic.setText("🎤 FALAR");
              FrameLayout.LayoutParams mp=new FrameLayout.LayoutParams(-2,-2,Gravity.BOTTOM|Gravity.CENTER_HORIZONTAL);
              mp.bottomMargin=35; root.addView(mic,mp);

              setContentView(root);
              web.loadUrl("file:///android_asset/jarves.html");

              web.setOnClickListener(v->toque());
              mic.setOnClickListener(v->ouvir());

              if(checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED)
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},10);

              h.postDelayed(()->anim("Idle"),2500);
            }

            void anim(String n){
              web.evaluateJavascript("playJarves("+org.json.JSONObject.quote(n)+")",null);
              status.setText("JARVES • "+n);
            }

            void toque(){
              long now=System.currentTimeMillis();
              if(now-longTapWindow>900)taps=0;
              longTapWindow=now; taps++;
              h.postDelayed(()->{
                int t=taps; taps=0;
                if(t==1){ anim("Listening"); falar("Oi?"); ouvir(); }
                else if(t==2){ anim("Happy"); falar("He he! Gostei."); }
                else { anim("Flee"); falar("Ai ai ai. Para, está me machucando!"); }
              },350);
            }

            void ouvir(){
              if(!SpeechRecognizer.isRecognitionAvailable(this))return;
              if(sr!=null) sr.destroy();
              sr=SpeechRecognizer.createSpeechRecognizer(this);
              sr.setRecognitionListener(new RecognitionListener(){
                public void onReadyForSpeech(Bundle b){anim("Listening");}
                public void onResults(Bundle b){
                  ArrayList<String> a=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if(a!=null&&!a.isEmpty()) comando(a.get(0).toLowerCase(Locale.ROOT));
                }
                public void onError(int e){anim("Idle");}
                public void onBeginningOfSpeech(){} public void onRmsChanged(float x){}
                public void onBufferReceived(byte[] x){} public void onEndOfSpeech(){}
                public void onPartialResults(Bundle b){} public void onEvent(int t,Bundle b){}
              });
              Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"pt-BR");
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
              sr.startListening(i);
            }

            void comando(String s){
              if(s.contains("feliz")){anim("Happy");falar("Oba! Eu estou feliz!");}
              else if(s.contains("esconde")){anim("Hide");falar("Vou me esconder.");}
              else if(s.contains("onde voce")||s.contains("onde você")||s.contains("volta")||s.contains("voltar")){
                anim("ComeBack");falar("Estou aqui!");
              } else if(s.contains("jarves")){anim("Listening");falar("Pode falar.");}
              else {anim("Idle");falar("Entendi.");}
            }

            void falar(String s){
              status.setText(s);
              Toast.makeText(this,s,Toast.LENGTH_SHORT).show();
            }

            @Override protected void onDestroy(){
              if(sr!=null)sr.destroy();
              if(web!=null)web.destroy();
              super.onDestroy();
            }
          }
          EOF

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-JOGO-V4-2-GLB-INTERATIVO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
