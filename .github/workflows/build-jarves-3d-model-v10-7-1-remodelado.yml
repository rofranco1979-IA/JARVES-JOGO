name: Gerar Modelo 3D JARVES V10.7.1 Remodelado
on:
  workflow_dispatch:
jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Instalar Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Criar script Blender
        run: |
          cat > /tmp/jarves_v10_7_1.py <<'PY'
          import bpy, math, os
          
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)
          
          def mat(name,color,metallic=.35,rough=.24,emission=None):
              m=bpy.data.materials.new(name)
              m.diffuse_color=(*color,1)
              m.use_nodes=True
              bs=m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value=(*color,1)
              bs.inputs["Metallic"].default_value=metallic
              bs.inputs["Roughness"].default_value=rough
              if emission and "Emission" in bs.inputs:
                  bs.inputs["Emission"].default_value=(*emission,1)
              return m
          
          WHITE=mat("Armadura branca",(.82,.88,.92),.55,.18)
          BLACK=mat("Preto brilhante",(.008,.015,.022),.72,.12)
          DARK=mat("Juntas",(.025,.04,.055),.70,.20)
          CYAN=mat("Luz cyan",(0,.55,.95),.25,.12,(0,.75,1))
          
          def cube(name,loc,scale,material,bevel=.08,rot=(0,0,0)):
              bpy.ops.mesh.primitive_cube_add(size=1,location=loc,rotation=rot)
              o=bpy.context.object; o.name=name; o.scale=scale
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              if bevel:
                  md=o.modifiers.new("Rounded","BEVEL"); md.width=bevel; md.segments=4
                  bpy.context.view_layer.objects.active=o
                  bpy.ops.object.modifier_apply(modifier=md.name)
              o.data.materials.append(material); return o
          
          def sph(name,loc,scale,material):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=24,ring_count=12,location=loc)
              o=bpy.context.object; o.name=name; o.scale=scale
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              o.data.materials.append(material); return o
          
          def cyl(name,loc,radius,depth,material,rot=(0,0,0)):
              bpy.ops.mesh.primitive_cylinder_add(vertices=24,radius=radius,depth=depth,location=loc,rotation=rot)
              o=bpy.context.object; o.name=name; o.data.materials.append(material); return o
          
          cube("Head",(0,0,2.48),(.62,.36,.39),WHITE,.20)
          cube("Visor",(0,-.365,2.48),(.49,.035,.19),BLACK,.10)
          sph("EyeL",(-.22,-.407,2.50),(.07,.025,.07),CYAN)
          sph("EyeR",(.22,-.407,2.50),(.07,.025,.07),CYAN)
          
          for x in (-1,1):
              cyl("Ear",(.655*x,0,2.48),.095,.075,DARK,(0,math.radians(90),0))
              cyl("EarLight",(.700*x,0,2.48),.065,.025,CYAN,(0,math.radians(90),0))
              cyl("Antenna",(.39*x,0,2.98),.032,.27,DARK)
              sph("AntennaLight",(.39*x,0,3.14),(.075,.075,.075),CYAN)
          
          cyl("Neck",(0,0,1.98),.14,.18,DARK)
          cube("Torso",(0,0,1.55),(.43,.27,.48),WHITE,.17)
          sph("ChestCore",(0,-.325,1.62),(.145,.035,.145),DARK)
          sph("ChestGlow",(0,-.365,1.62),(.105,.020,.105),CYAN)
          cube("Waist",(0,0,1.08),(.31,.24,.11),DARK,.055)
          cube("Pelvis",(0,0,.88),(.29,.22,.20),WHITE,.10)
          
          for x in (-1,1):
              sph("Shoulder",(.57*x,0,1.72),(.18,.18,.18),WHITE)
              cyl("UpperArm",(.66*x,0,1.39),.115,.43,WHITE)
              sph("Elbow",(.66*x,0,1.13),(.12,.12,.12),CYAN)
              cyl("Forearm",(.66*x,0,.86),.125,.40,WHITE)
              cube("Palm",(.66*x,0,.51),(.12,.10,.11),DARK,.045)
              cube("ClawA",(.66*x,-.105,.32),(.075,.055,.22),WHITE,.045,(math.radians(-10),0,math.radians(-10*x)))
              cube("ClawB",(.66*x,.105,.32),(.075,.055,.22),WHITE,.045,(math.radians(10),0,math.radians(10*x)))
          
          for x in (-1,1):
              sph("Hip",(.22*x,0,.72),(.15,.15,.15),DARK)
              cube("Thigh",(.22*x,0,.38),(.14,.16,.30),WHITE,.08)
              cube("Shin",(.22*x,0,-.25),(.15,.17,.31),WHITE,.07)
              cube("Foot",(.22*x,-.055,-.61),(.18,.28,.10),WHITE,.055)
          
          out=os.path.join(os.environ["GITHUB_WORKSPACE"],"modelo3d","jarves_v10_7_1_remodelado.glb")
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.export_scene.gltf(filepath=out,export_format='GLB',export_animations=False,export_apply=True)
          print(out)
          PY
      - name: Gerar GLB V10.7.1
        run: |
          mkdir -p "$GITHUB_WORKSPACE/modelo3d"
          blender -b --python /tmp/jarves_v10_7_1.py
      - name: Verificar GLB V10.7.1
        run: |
          ls -lh "$GITHUB_WORKSPACE/modelo3d/jarves_v10_7_1_remodelado.glb"
          test -s "$GITHUB_WORKSPACE/modelo3d/jarves_v10_7_1_remodelado.glb"
      - name: Publicar GLB
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-3D-V10-7-1-REMODELADO-GLB
          path: modelo3d/jarves_v10_7_1_remodelado.glb

