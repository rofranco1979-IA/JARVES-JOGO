name: Gerar Modelo 3D JARVES V9.5

on:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Blender e NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          BLENDER_PY="$(blender -b --python-expr "import sys; print(sys.executable)" 2>/dev/null | grep -E '^/' | tail -n 1)"
          echo "Python Blender: $BLENDER_PY"
          "$BLENDER_PY" -m ensurepip --upgrade || true
          "$BLENDER_PY" -m pip install --upgrade numpy
          "$BLENDER_PY" -c "import numpy; print('NumPy OK', numpy.__version__)"

      - name: Criar modelo JARVES V9.5
        run: |
          mkdir -p "$GITHUB_WORKSPACE/modelo3d"
          cat > /tmp/jarves_v9_5.py <<'PY'
          import bpy, math, os
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          def material(name, rgb, metallic=0.0, rough=.3, emission=False):
              m=bpy.data.materials.new(name); m.diffuse_color=(*rgb,1); m.use_nodes=True
              bs=m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value=(*rgb,1)
              bs.inputs["Metallic"].default_value=metallic
              bs.inputs["Roughness"].default_value=rough
              if emission:
                  for key in ("Emission Color","Emission"):
                      if key in bs.inputs: bs.inputs[key].default_value=(*rgb,1)
                  if "Emission Strength" in bs.inputs: bs.inputs["Emission Strength"].default_value=4
              return m

          WHITE=material("Armadura branca",(0.78,.86,.92),.65,.2)
          BLACK=material("Visor preto",(.008,.015,.025),.75,.12)
          DARK=material("Juntas",(.025,.045,.065),.7,.25)
          CYAN=material("Luzes cyan",(0,.45,1),.25,.12,True)

          def cube(n,loc,sc,mat,bev=.10):
              bpy.ops.mesh.primitive_cube_add(size=1,location=loc)
              o=bpy.context.object; o.name=n; o.scale=sc
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              if bev:
                  md=o.modifiers.new("Arredondado","BEVEL"); md.width=bev; md.segments=3
                  bpy.context.view_layer.objects.active=o; bpy.ops.object.modifier_apply(modifier=md.name)
              o.data.materials.append(mat); return o

          def sph(n,loc,sc,mat):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=24,ring_count=12,location=loc)
              o=bpy.context.object; o.name=n; o.scale=sc
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              o.data.materials.append(mat); return o

          def cyl(n,loc,r,d,mat,rot=(0,0,0)):
              bpy.ops.mesh.primitive_cylinder_add(vertices=24,radius=r,depth=d,location=loc,rotation=rot)
              o=bpy.context.object; o.name=n; o.data.materials.append(mat); return o

          bpy.ops.object.armature_add(enter_editmode=True, location=(0,0,0))
          rig=bpy.context.object; rig.name="JARVES_Rig"
          eb=rig.data.edit_bones
          root=eb[0]; root.name="Root"; root.head=(0,0,-1.0); root.tail=(0,0,.70)
          def bone(n,h,t,p):
              b=eb.new(n); b.head=h; b.tail=t; b.parent=p; return b
          spine=bone("Spine",(0,0,.65),(0,0,2.18),root)
          head=bone("Head",(0,0,2.18),(0,0,2.92),spine)
          ual=bone("UpperArm.L",(-.62,0,1.90),(-.94,0,1.60),spine)
          fal=bone("Forearm.L",(-.94,0,1.60),(-1.18,0,1.18),ual)
          uar=bone("UpperArm.R",(.62,0,1.90),(.94,0,1.60),spine)
          far=bone("Forearm.R",(.94,0,1.60),(1.18,0,1.18),uar)
          thl=bone("Thigh.L",(-.29,0,.62),(-.29,0,.03),root)
          shl=bone("Shin.L",(-.29,0,.03),(-.29,0,-.72),thl)
          thr=bone("Thigh.R",(.29,0,.62),(.29,0,.03),root)
          shr=bone("Shin.R",(.29,0,.03),(.29,0,-.72),thr)
          bpy.ops.object.mode_set(mode='OBJECT')

          parts={}
          parts["Torso"]=sph("Torso",(0,.02,1.30),(.53,.34,.48),WHITE)
          parts["ChestPanel"]=cube("ChestPanel",(0,-.35,1.34),(.32,.04,.24),WHITE,.12)
          parts["ChestCore"]=sph("ChestCore",(0,-.40,1.39),(.14,.04,.14),CYAN)
          parts["Pelvis"]=sph("Pelvis",(0,0,.72),(.34,.24,.20),WHITE)
          parts["Waist"]=cyl("Waist",(0,0,.86),.28,.18,DARK)
          parts["Neck"]=cyl("Neck",(0,0,1.78),.12,.18,DARK)

          # Cabeça menor e mais oval.
          parts["HeadShell"]=sph("HeadShell",(0,.02,2.08),(.47,.35,.32),WHITE)
          parts["Visor"]=cube("Visor",(0,-.355,2.08),(.39,.035,.145),BLACK,.10)
          parts["Eye.L"]=sph("Eye.L",(-.16,-.402,2.09),(.065,.022,.045),CYAN)
          parts["Eye.R"]=sph("Eye.R",(.16,-.402,2.09),(.065,.022,.045),CYAN)
          for x,s in [(-.28,"L"),(.28,"R")]:
              parts["Antenna."+s]=cyl("Antenna."+s,(x,0,2.43),.025,.20,DARK)
              parts["AntennaLight."+s]=sph("AntennaLight."+s,(x,0,2.55),(.065,.065,.065),CYAN)

          # Braços mais finos: cilindros orientados acompanhando o braço.
          for x,s in [(-1,"L"),(1,"R")]:
              parts["Shoulder."+s]=sph("Shoulder."+s,(.62*x,0,1.72),(.15,.16,.15),DARK)
              parts["UpperArm."+s]=cyl("UpperArm."+s,(.77*x,0,1.52),.105,.42,WHITE,(0,math.radians(40*x),0))
              parts["Elbow."+s]=sph("Elbow."+s,(.91*x,0,1.32),(.11,.11,.11),CYAN)
              parts["Forearm."+s]=cyl("Forearm."+s,(1.02*x,0,1.13),.10,.38,WHITE,(0,math.radians(30*x),0))
              # Mão tipo alicate: palma compacta + duas garras.
              parts["Palm."+s]=sph("Palm."+s,(1.10*x,0,.94),(.12,.10,.12),DARK)
              parts["ClawA."+s]=cube("ClawA."+s,(1.16*x,-.055,.89),(.10,.045,.045),WHITE,.035)
              parts["ClawB."+s]=cube("ClawB."+s,(1.16*x,.055,.89),(.10,.045,.045),WHITE,.035)

          for x,s in [(-.29,"L"),(.29,"R")]:
              parts["Hip."+s]=sph("Hip."+s,(x,0,.49),(.16,.16,.16),DARK)
              parts["Thigh."+s]=cyl("Thigh."+s,(x,0,.19),.145,.48,WHITE)
              parts["Knee."+s]=sph("Knee."+s,(x,0,-.07),(.13,.13,.13),DARK)
              parts["Shin."+s]=cyl("Shin."+s,(x,0,-.30),.14,.44,WHITE)
              parts["Foot."+s]=cube("Foot."+s,(x,-.10,-.55),(.20,.27,.11),WHITE,.09)

          mapping={
              "Torso":"Spine","ChestPanel":"Spine","ChestCore":"Spine","Neck":"Spine",
              "Pelvis":"Root","Waist":"Root",
              "HeadShell":"Head","Visor":"Head","Eye.L":"Head","Eye.R":"Head",
              "Antenna.L":"Head","Antenna.R":"Head","AntennaLight.L":"Head","AntennaLight.R":"Head",
              "Shoulder.L":"Spine","Shoulder.R":"Spine",
              "UpperArm.L":"UpperArm.L","Elbow.L":"UpperArm.L",
              "UpperArm.R":"UpperArm.R","Elbow.R":"UpperArm.R",
              "Forearm.L":"Forearm.L","Palm.L":"Forearm.L","ClawA.L":"Forearm.L","ClawB.L":"Forearm.L",
              "Forearm.R":"Forearm.R","Palm.R":"Forearm.R","ClawA.R":"Forearm.R","ClawB.R":"Forearm.R",
              "Hip.L":"Root","Hip.R":"Root",
              "Thigh.L":"Thigh.L","Knee.L":"Thigh.L","Shin.L":"Shin.L","Foot.L":"Shin.L",
              "Thigh.R":"Thigh.R","Knee.R":"Thigh.R","Shin.R":"Shin.R","Foot.R":"Shin.R"
          }
          bpy.context.view_layer.update()
          for objname,bname in mapping.items():
              o=parts[objname]; world=o.matrix_world.copy()
              o.parent=rig; o.parent_type='BONE'; o.parent_bone=bname
              bpy.context.view_layer.update(); o.matrix_world=world

          rig.animation_data_create()
          idle=bpy.data.actions.new("Idle"); rig.animation_data.action=idle
          ph=rig.pose.bones["Head"]; ph.rotation_mode='XYZ'
          for f,a in [(1,0),(30,.08),(60,0),(90,-.08),(120,0)]:
              ph.rotation_euler[2]=a; ph.keyframe_insert("rotation_euler",frame=f)
          wave=bpy.data.actions.new("Wave"); rig.animation_data.action=wave
          ua=rig.pose.bones["UpperArm.R"]; ua.rotation_mode='XYZ'
          fa=rig.pose.bones["Forearm.R"]; fa.rotation_mode='XYZ'
          for f,a,b in [(1,0,0),(10,-.9,.5),(20,-.9,-.5),(30,-.9,.5),(40,-.9,-.5),(55,0,0)]:
              ua.rotation_euler[1]=a; fa.rotation_euler[2]=b
              ua.keyframe_insert("rotation_euler",frame=f); fa.keyframe_insert("rotation_euler",frame=f)
          rig.animation_data.action=None
          for act in (idle,wave):
              tr=rig.animation_data.nla_tracks.new(); tr.name=act.name
              tr.strips.new(act.name,int(act.frame_range[0]),act)

          out=os.path.join(os.environ["GITHUB_WORKSPACE"],"modelo3d","jarves_v9_5.glb")
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.export_scene.gltf(filepath=out,export_format='GLB',export_animations=True,export_apply=True)
          print("JARVES V9.5 CRIADO:",out)
          PY

      - name: Gerar GLB V9.5
        run: |
          blender -b --python /tmp/jarves_v9_5.py 2>&1 | tee "$GITHUB_WORKSPACE/modelo3d/blender-v9-5.log"

      - name: Verificar GLB V9.5
        run: |
          ls -lh "$GITHUB_WORKSPACE/modelo3d/jarves_v9_5.glb"
          test -s "$GITHUB_WORKSPACE/modelo3d/jarves_v9_5.glb"
          blender -b --python-expr "import bpy; bpy.ops.import_scene.gltf(filepath='$GITHUB_WORKSPACE/modelo3d/jarves_v9_5.glb'); print('GLB V9.5 IMPORTADO OK', len(bpy.context.scene.objects))"

      - name: Publicar JARVES 3D V9.5
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-3D-V9-5-GLB
          path: modelo3d/jarves_v9_5.glb
          retention-days: 30
