name: Gerar APK ROBO AMIGO JARVES V1.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar projeto V12-8
        shell: bash
        run: |
          set -e
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/jarves/assistant app/src/main/res/values
          # FILE settings.gradle
          echo '' | base64 -d > settings.gradle
          # FILE build.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle
          # FILE app/build.gradle
          echo '' | base64 -d > app/build.gradle
          # FILE app/src/main/res/values/styles.xml
          echo 'PHJlc291cmNlcz4KPHN0eWxlIG5hbWU9IkFwcFRoZW1lIiBwYXJlbnQ9ImFuZHJvaWQ6c3R5bGUvVGhlbWUuTWF0ZXJpYWwuTGlnaHQuTm9BY3Rpb25CYXIiPgogICAgPGl0ZW0gbmFtZT0iYW5kcm9pZDpmb250RmFtaWx5Ij5zYW5zPC9pdGVtPgogICAgPGl0ZW0gbmFtZT0iYW5kcm9pZDpjb2xvckFjY2VudCI+IzAwRDlGRjwvaXRlbT4KPC9zdHlsZT4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > app/src/main/res/values/styles.xml
          # FILE app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          # FILE app/src/main/java/com/jarves/assistant/MainActivity.java
          echo '' | base64 -d > app/src/main/java/com/jarves/assistant/MainActivity.java
          # FILE app/src/main/java/com/jarves/assistant/JarvesHeadView.java
          echo '' | base64 -d > app/src/main/java/com/jarves/assistant/JarvesHeadView.java
          # FILE app/src/main/java/com/jarves/assistant/JarvesService.java
          echo '' | base64 -d > app/src/main/java/com/jarves/assistant/JarvesService.java
      - name: Identificar Robo Amigo JARVES V1.2
        shell: bash
        run: |
          set -e
          # Mantem o codigo V12.8, mas usa um pacote novo para nao conflitar
          # com APKs JARVES antigos assinados por outros builds de teste.
          sed -i 's/applicationId "com.jarves.assistant"/applicationId "com.roboamigo.jarves"/' app/build.gradle
          sed -i 's/versionCode 128/versionCode 102/' app/build.gradle
          sed -i 's/versionName "12.8"/versionName "1.2"/' app/build.gradle
          sed -i 's/android:label="JARVES"/android:label="Robô Amigo JARVES"/' app/src/main/AndroidManifest.xml
          echo "Pacote: com.roboamigo.jarves | Versao: 1.2"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-AMIGO-JARVES-V1-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
