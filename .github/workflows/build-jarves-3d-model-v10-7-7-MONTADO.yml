name: Gerar Modelo 3D JARVES V10.7.7 MONTADO

on:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          BLENDER_PY="/usr/bin/4.0/python/bin/python3.12"
          if [ -x "$BLENDER_PY" ]; then
            "$BLENDER_PY" -m ensurepip --upgrade || true
            "$BLENDER_PY" -m pip install --upgrade numpy
          fi
      - name: Gerar modelo
        run: |
          mkdir -p "$GITHUB_WORKSPACE/modelo3d"
          cat > /tmp/jarves.py <<'PY'
          import bpy, math, os
          bpy.ops.object.select_all(action='SELECT'); bpy.ops.object.delete(use_global=False)

          def mat(n,c,metal=.4,rough=.2):
              m=bpy.data.materials.new(n); m.diffuse_color=(*c,1); m.use_nodes=True
              p=m.node_tree.nodes.get("Principled BSDF"); p.inputs["Base Color"].default_value=(*c,1)
              p.inputs["Metallic"].default_value=metal; p.inputs["Roughness"].default_value=rough
              return m
          W=mat("Branco",(.82,.88,.92),.55,.18); D=mat("Juntas",(.02,.035,.05),.72,.18)
          B=mat("Visor",(.005,.012,.02),.75,.10); C=mat("Cyan",(0,.55,.95),.25,.12)

          def cube(n,l,s,m,b=.06):
              bpy.ops.mesh.primitive_cube_add(size=1,location=l); o=bpy.context.object; o.name=n; o.scale=s
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              if b:
                  q=o.modifiers.new("Round","BEVEL"); q.width=b; q.segments=3
                  bpy.context.view_layer.objects.active=o; bpy.ops.object.modifier_apply(modifier=q.name)
              o.data.materials.append(m)
          def sph(n,l,s,m):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=20,ring_count=10,location=l)
              o=bpy.context.object; o.name=n; o.scale=s
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True); o.data.materials.append(m)
          def cyl(n,l,r,d,m,rot=(0,0,0)):
              bpy.ops.mesh.primitive_cylinder_add(vertices=20,radius=r,depth=d,location=l,rotation=rot)
              o=bpy.context.object; o.name=n; o.data.materials.append(m)

          # Cabeça e pescoço encostados
          cube("Head",(0,0,2.32),(.54,.34,.35),W,.18)
          cube("Visor",(0,-.345,2.34),(.43,.035,.16),B,.08)
          sph("EyeL",(-.19,-.385,2.35),(.065,.025,.065),C); sph("EyeR",(.19,-.385,2.35),(.065,.025,.065),C)
          for x in (-1,1):
              cyl("Ear",(.565*x,0,2.34),.065,.055,D,(0,math.radians(90),0))
              cyl("Antenna",(.32*x,0,2.72),.026,.22,D); sph("AntennaLight",(.32*x,0,2.86),(.065,.065,.065),C)
          cyl("Neck",(0,0,1.94),.115,.22,D)

          # Tórax longo encostado no pescoço e cintura
          cube("Torso",(0,0,1.52),(.39,.27,.48),W,.15)
          sph("Core",(0,-.305,1.55),(.10,.025,.19),C)
          cyl("Waist",(0,0,1.00),.20,.16,D)
          cube("Pelvis",(0,0,.83),(.27,.22,.16),W,.08)

          # Braços montados
          for x in (-1,1):
              sph("Shoulder",(.48*x,0,1.72),(.15,.15,.15),W)
              cyl("UpperArm",(.55*x,0,1.43),.095,.42,W)
              sph("Elbow",(.55*x,0,1.17),(.115,.115,.115),C)
              cyl("Forearm",(.55*x,0,.91),.10,.40,W)
              sph("Wrist",(.55*x,0,.67),(.075,.075,.075),D)
              cube("Palm",(.55*x,0,.57),(.09,.085,.10),D,.035)
              cube("ClawA",(.55*x,-.065,.40),(.045,.035,.15),W,.03)
              cube("ClawB",(.55*x,.065,.40),(.045,.035,.15),W,.03)

          # Pernas: coxa -> joelho redondo/cilíndrico -> canela, sem vãos
          for x in (-1,1):
              sph("Hip",(.19*x,0,.66),(.125,.125,.125),D)
              cyl("Thigh",(.19*x,0,.40),.125,.40,W)
              sph("KneeCore",(.19*x,0,.15),(.13,.13,.13),D)
              cyl("KneeRing",(.19*x,-.005,.15),.145,.10,C,(math.radians(90),0,0))
              cyl("Shin",(.19*x,0,-.16),.125,.48,W)
              cyl("Ankle",(.19*x,0,-.44),.075,.12,D)
              cube("Foot",(.19*x,-.07,-.55),(.16,.23,.10),W,.05)

          out=os.path.join(os.environ["GITHUB_WORKSPACE"],"modelo3d","jarves_v10_7_7.glb")
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.export_scene.gltf(filepath=out,export_format='GLB',export_animations=False,export_apply=True)
          assert os.path.isfile(out) and os.path.getsize(out)>0
          print("GLB CRIADO:",out,os.path.getsize(out))
          PY
          blender -b --python /tmp/jarves.py
          test -s "$GITHUB_WORKSPACE/modelo3d/jarves_v10_7_7.glb"
      - name: Publicar GLB
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-3D-V10-7-7-MONTADO-GLB
          path: modelo3d/jarves_v10_7_7.glb
          if-no-files-found: error
