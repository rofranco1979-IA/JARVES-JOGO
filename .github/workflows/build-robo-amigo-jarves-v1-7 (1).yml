name: Gerar APK ROBO AMIGO JARVES V1.7 - 3D V10.8.2 ASSETLOADER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar projeto V12-12
        shell: bash
        run: |
          set -e
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/jarves/assistant app/src/main/res/values
          # FILE settings.gradle
          echo '' | base64 -d > settings.gradle
          # FILE build.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle
          # FILE app/build.gradle
          echo '' | base64 -d > app/build.gradle
          # FILE app/src/main/res/values/styles.xml
          echo 'PHJlc291cmNlcz4KPHN0eWxlIG5hbWU9IkFwcFRoZW1lIiBwYXJlbnQ9ImFuZHJvaWQ6c3R5bGUvVGhlbWUuTWF0ZXJpYWwuTGlnaHQuTm9BY3Rpb25CYXIiPgogICAgPGl0ZW0gbmFtZT0iYW5kcm9pZDpmb250RmFtaWx5Ij5zYW5zPC9pdGVtPgogICAgPGl0ZW0gbmFtZT0iYW5kcm9pZDpjb2xvckFjY2VudCI+IzAwRDlGRjwvaXRlbT4KPC9zdHlsZT4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > app/src/main/res/values/styles.xml
          # FILE app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          # FILE app/src/main/java/com/jarves/assistant/MainActivity.java
          echo '' | base64 -d > app/src/main/java/com/jarves/assistant/MainActivity.java
          # FILE app/src/main/java/com/jarves/assistant/JarvesHeadView.java
          echo '' | base64 -d > app/src/main/java/com/jarves/assistant/JarvesHeadView.java
          # FILE app/src/main/java/com/jarves/assistant/JarvesService.java
          echo '' | base64 -d > app/src/main/java/com/jarves/assistant/JarvesService.java

      - name: Integrar JARVES V10.8.2 3D 360 no assistente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p app/src/main/assets /tmp/jarves1082
          RUN_ID=$(gh run list --workflow build-jarves-3d-model-v10-8-2-MAGRO-ENCAIXADO.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -n JARVES-3D-V10-8-2-MAGRO-ENCAIXADO-GLB -D /tmp/jarves1082
          cp /tmp/jarves1082/jarves_v10_8_2.glb app/src/main/assets/jarves.glb
          test -s app/src/main/assets/jarves.glb

          # V1.7: model-viewer local + origem HTTPS interna via WebViewAssetLoader
          curl -L --fail --retry 3 https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js -o app/src/main/assets/model-viewer.min.js
          test -s app/src/main/assets/model-viewer.min.js

          cat > app/src/main/assets/jarves.html <<'EOF'
          <!doctype html><html><head>
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <script type="module" src="model-viewer.min.js"></script>
          <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10}model-viewer{width:100%;height:100%;background:#080b10;--poster-color:#080b10}.msg{position:fixed;left:0;right:0;top:48%;text-align:center;color:#7eeaff;font:16px sans-serif;z-index:0}</style>
          </head><body><div class="msg" id="m">Carregando JARVES 3D...</div>
          <model-viewer id="j" src="jarves.glb" camera-controls interaction-prompt="none" shadow-intensity="1" exposure="1.05" camera-orbit="0deg 82deg 4.2m" min-camera-orbit="auto auto 2m" max-camera-orbit="auto auto 8m"></model-viewer>
          <script>const j=document.getElementById('j'),m=document.getElementById('m');j.addEventListener('load',()=>{m.style.display='none';if(window.Android)Android.modelLoaded()});j.addEventListener('error',e=>{m.textContent='ERRO AO CARREGAR JARVES 3D';if(window.Android)Android.modelError('GLB/model-viewer')});</script>
          </body></html>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          t=p.read_text()
          import re
          t=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.roboamigo.jarves"',t)
          t=re.sub(r'versionCode\s+\d+','versionCode 17',t)
          t=re.sub(r'versionName\s+"[^"]+"','versionName "1.7"',t)
          if 'androidx.webkit:webkit' not in t:
              t += '\ndependencies { implementation \"androidx.webkit:webkit:1.12.1\" }\n'
          p.write_text(t)
          PY

          cat > app/src/main/java/com/jarves/assistant/MainActivity.java <<'EOF'
          package com.jarves.assistant;
          import android.Manifest; import android.app.*; import android.os.*; import android.content.*; import android.content.pm.PackageManager; import android.graphics.Color; import android.view.*; import android.webkit.*; import android.widget.*; import android.speech.*; import android.speech.tts.TextToSpeech; import java.util.*; import java.text.*; import androidx.webkit.WebViewAssetLoader; import androidx.webkit.WebViewClientCompat;
          public class MainActivity extends Activity {
            WebView web; Button ativar,mic; TextView status; SpeechRecognizer sr; TextToSpeech tts; boolean ttsOk=false;
            public void onCreate(Bundle b){super.onCreate(b); montar(); iniciarVoz();}
            void montar(){
              FrameLayout root=new FrameLayout(this); root.setBackgroundColor(Color.rgb(8,11,16));
              web=new WebView(this); web.setBackgroundColor(Color.TRANSPARENT); web.setLayerType(View.LAYER_TYPE_HARDWARE,null); WebSettings ws=web.getSettings(); ws.setJavaScriptEnabled(true); ws.setDomStorageEnabled(true); ws.setAllowFileAccess(false); ws.setAllowContentAccess(false);
              final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/",new WebViewAssetLoader.AssetsPathHandler(this)).build();
              web.addJavascriptInterface(new Object(){@JavascriptInterface public void modelLoaded(){runOnUiThread(()->status.setText("JARVES V1.7 • 3D V10.8.2 OK • arraste para girar 360°"));}@JavascriptInterface public void modelError(String e){runOnUiThread(()->status.setText("ERRO 3D: "+e));}},"Android");
              web.setWebChromeClient(new WebChromeClient()); web.setWebViewClient(new WebViewClientCompat(){@Override public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){return loader.shouldInterceptRequest(r.getUrl());}});
              root.addView(web,new FrameLayout.LayoutParams(-1,-1)); web.loadUrl("https://appassets.androidplatform.net/assets/jarves.html");
              status=new TextView(this); status.setText("ROBÔ AMIGO JARVES • V1.7 • carregando V10.8.2..."); status.setTextColor(Color.WHITE); status.setTextSize(15); status.setGravity(Gravity.CENTER); status.setPadding(12,18,12,12); root.addView(status,new FrameLayout.LayoutParams(-1,-2,Gravity.TOP));
              LinearLayout bar=new LinearLayout(this); bar.setOrientation(LinearLayout.HORIZONTAL); bar.setGravity(Gravity.CENTER); bar.setPadding(10,8,10,18); ativar=new Button(this); ativar.setText(JarvesService.RUNNING?"DESATIVAR JARVES":"ATIVAR JARVES"); mic=new Button(this); mic.setText("🎤 FALAR"); bar.addView(ativar,new LinearLayout.LayoutParams(0,-2,1)); bar.addView(mic,new LinearLayout.LayoutParams(0,-2,1)); root.addView(bar,new FrameLayout.LayoutParams(-1,-2,Gravity.BOTTOM)); setContentView(root);
              ativar.setOnClickListener(v->{if(JarvesService.RUNNING){stopService(new Intent(this,JarvesService.class));ativar.setText("ATIVAR JARVES");}else ativar();}); mic.setOnClickListener(v->ouvir()); if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},10);
            }
            void iniciarVoz(){tts=new TextToSpeech(this,s->{if(s==TextToSpeech.SUCCESS){tts.setLanguage(new Locale("pt","BR"));tts.setPitch(.78f);tts.setSpeechRate(.94f);ttsOk=true;falar("Oi. Eu sou o Jarves.");}});}
            void falar(String x){status.setText(x);if(ttsOk)tts.speak(x,TextToSpeech.QUEUE_FLUSH,null,"JARVES");}
            void ativar(){Intent i=new Intent(this,JarvesService.class);if(Build.VERSION.SDK_INT>=26)startForegroundService(i);else startService(i);ativar.setText("DESATIVAR JARVES");falar("Jarves ativado.");}
            void ouvir(){if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED){requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},10);return;}if(!SpeechRecognizer.isRecognitionAvailable(this)){falar("O reconhecimento de voz não está disponível.");return;}if(sr!=null)sr.destroy();sr=SpeechRecognizer.createSpeechRecognizer(this);sr.setRecognitionListener(new RecognitionListener(){public void onReadyForSpeech(Bundle b){status.setText("Ouvindo...");}public void onResults(Bundle b){ArrayList<String>a=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);if(a!=null&&!a.isEmpty())responder(a.get(0));else falar("Não entendi.");}public void onError(int e){status.setText("Toque em FALAR para tentar novamente");}public void onBeginningOfSpeech(){}public void onRmsChanged(float f){}public void onBufferReceived(byte[]b){}public void onEndOfSpeech(){}public void onPartialResults(Bundle b){}public void onEvent(int i,Bundle b){}});Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"pt-BR");i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);sr.startListening(i);}
            void responder(String q){String x=q.toLowerCase(new Locale("pt","BR"));if(x.contains("hora")){String h=new SimpleDateFormat("HH:mm",Locale.getDefault()).format(new Date());falar("Agora são "+h.replace(":"," e "));}else if(x.contains("seu nome")||x.contains("quem é você")){falar("Eu sou o Jarves, seu robô amigo.");}else if(x.contains("jarves")||x.contains("jarvis")){falar("Pode falar.");}else falar("Entendi: "+q);}
            protected void onDestroy(){if(sr!=null)sr.destroy();if(tts!=null)tts.shutdown();if(web!=null)web.destroy();super.onDestroy();}
          }
          EOF

          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml || sed -i 's#<manifest#<manifest#' app/src/main/AndroidManifest.xml
          echo "GLB V10.8.2 integrado: $(du -h app/src/main/assets/jarves.glb | cut -f1)"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-AMIGO-JARVES-V1-7-3D-V10-8-2-360-APK
          path: app/build/outputs/apk/debug/app-debug.apk
