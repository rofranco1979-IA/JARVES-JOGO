name: Gerar APK JARVES JOGO V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/jarves/jogo app/src/main/res/values
          echo '' | base64 -d > settings.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle
          echo '' | base64 -d > app/build.gradle
          echo '' | base64 -d > app/src/main/res/values/styles.xml
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/java/com/jarves/jogo/JarvesView.java
          echo '' | base64 -d > app/src/main/java/com/jarves/jogo/MainActivity.java
      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-JOGO-V1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
