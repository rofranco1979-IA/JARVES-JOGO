name: Gerar APK JARVES JOGO V1 CORRIGIDO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/jarves/jogo app/src/main/res/values
          echo '' | base64 -d > settings.gradle
          echo 'cGx1Z2lucyB7IGlkICJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIgdmVyc2lvbiAiOC43LjMiIGFwcGx5IGZhbHNlIH0K' | base64 -d > build.gradle
          echo 'cGx1Z2lucyB7IGlkICJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIgfQphbmRyb2lkIHsgbmFtZXNwYWNlICJjb20uamFydmVzLmpvZ28iOyBjb21waWxlU2RrIDM1CiBkZWZhdWx0Q29uZmlnIHsgYXBwbGljYXRpb25JZCAiY29tLmphcnZlcy5qb2dvIjsgbWluU2RrIDI2OyB0YXJnZXRTZGsgMzU7IHZlcnNpb25Db2RlIDI7IHZlcnNpb25OYW1lICIxLjEiIH0gfQo=' | base64 -d > app/build.gradle
          echo '' | base64 -d > app/src/main/res/values/styles.xml
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/java/com/jarves/jogo/JarvesView.java
          echo '' | base64 -d > app/src/main/java/com/jarves/jogo/MainActivity.java
      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-JOGO-V1-CORRIGIDO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
