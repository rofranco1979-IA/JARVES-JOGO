name: Gerar Modelo 3D JARVES V10.7 Remodelado

on:
  workflow_dispatch:

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Criar JARVES remodelado
        run: |
          mkdir -p "$GITHUB_WORKSPACE/modelo3d"
          echo "" | base64 -d > /tmp/jarves_v10_7.py

      - name: Gerar GLB V10.7
        run: |
          blender -b --python /tmp/jarves_v10_7.py 2>&1 | tee "$GITHUB_WORKSPACE/modelo3d/blender-v10-7.log"

      - name: Verificar GLB V10.7
        run: |
          ls -lh "$GITHUB_WORKSPACE/modelo3d/jarves_v10_7_remodelado.glb"
          test -s "$GITHUB_WORKSPACE/modelo3d/jarves_v10_7_remodelado.glb"

      - name: Publicar JARVES 3D V10.7
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-3D-V10-7-REMODELADO-GLB
          path: modelo3d/jarves_v10_7_remodelado.glb
          retention-days: 30
